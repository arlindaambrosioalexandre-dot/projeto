<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Indice.css">
</head>
<style>
body{margin:0; font-family:Arial; background:#f0f2f5; background-image: url(Imagens/ai-generated-blurred-background-interior-of-a-large-modern-warehouse-photo.jpg);        background-position: center;
background-size: cover;
width: 100%;
height: 100%;
background-repeat: no-repeat;}
.topo{ color:white; padding:14px; display:flex; align-items:center; gap:10px; text-align: center;}
.btn-voltar{width:40px; height:40px; border-radius:50%; border:none; background:white; color:#1f7dd8; font-size:18px}
.card{max-width:480px; margin:15px auto; background:white; border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.avatar{width:85px; height:85px; background:#dbeaff; color:#1f7dd8; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:bold; margin:0 auto 10px}
.campo{padding:11px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; font-size:14px}
.campo b{color:#333} .campo span{color:#555; text-align:right; max-width:60%}
.badge{padding:3px 10px; border-radius:12px; font-size:12px; color:white}
.masculino{background:#1f7dd8} .feminino{background:#ff4d8a}
.btn{width:100%; padding:13px; border-radius:10px; border:none; font-weight:bold; margin-top:10px; cursor:pointer}
.btn1{background:#1f7dd8; color:white} .btn2{background:#eee}
#botao{
  border: 2px solid rgba(0, 157, 255, 0.845);
  margin-left: 1100px;
  border-radius: 20px;
  width: 100px;
  height: 30px;
  background-color: rgb(127, 255, 244);
 margin-block: 30px;
 
}
h1{
  text-align: justify;
}

nav{
  display: flex;


}
#botao a{
text-decoration: none;  
}
#botao-principal a{
text-decoration: none;  
}
#botao{
  text-decoration: none;
}

</style>
<body>
    <nav>
 <h1>LFentregadora.Lda</h1>
 <button id="botao"><a href="Segunda pagina.html">Voltar</a></button>
</nav>
    
    <div class="topo">
  <h3 style="text-align: center; margin-left: 650px; font-size: 30px;">Perfil do cliente</h3>
</div>

<div class="card" id="cardPerfil">
  <div class="avatar" id="avatar">LF</div>
  <h2 style="text-align:center; margin:5px 0" id="p_nome">-</h2>
  <p style="text-align:center; margin:0"><span class="badge" id="p_sexo">-</span> <span style="font-size:12px; color:#888" id="p_idade"></span></p>
  
  <div style="margin-top:18px; ">
    <div class="campo"><b>Nome completo:</b><span id="p_nomeCompleto">-</span></div>
    <div class="campo"><b>Apelido:</b><span id="p_apelido">-</span></div>
    <div class="campo"><b>Data nascimento:</b><span id="p_nasc">-</span></div>
    <div class="campo"><b>N. de BI:</b><span id="p_bi">-</span></div>
    <div class="campo"><b>Contacto:</b><span id="p_contacto">-</span></div>
    <div class="campo"><b>Email:</b><span id="p_email">-</span></div>
    <div class="campo"><b>Sexo:</b><span id="p_sexo2">-</span></div>
    <div class="campo"><b>Cadastrado em:</b><span id="p_data">-</span></div>
  </div>

  <button class="btn btn1" onclick="location.href='incomendas.html'">Fazer encomenda</button>
  <button class="btn btn2" onclick="sair()">Sair da conta</button>
</div>
    

<script>
// TAG QUE PEGA E PREENCHE AUTOMÁTICO
function carregar(){
  let cliente = JSON.parse(localStorage.getItem('clienteLF') || 'null');
  if(!cliente){
    document.getElementById('cardPerfil').innerHTML = "<p style='text-align:center'>Nenhum dado encontrado.<br><a href='cadastroo.html'>Fazer cadastro</a></p>";
    return;
  }
  // PREENCHE AUTOMÁTICO
  document.getElementById('avatar').textContent = cliente.nomeCompleto.charAt(0).toUpperCase() + (cliente.apelido.charAt(0).toUpperCase()||'');
  document.getElementById('p_nome').textContent = cliente.nomeCompleto + " " + cliente.apelido;
  document.getElementById('p_nomeCompleto').textContent = cliente.nomeCompleto;
  document.getElementById('p_apelido').textContent = cliente.apelido;
  document.getElementById('p_nasc').textContent = cliente.dataNascimento ? new Date(cliente.dataNascimento).toLocaleDateString('pt-MZ') : '-';
  document.getElementById('p_bi').textContent = cliente.bi || '-';
  document.getElementById('p_contacto').textContent = cliente.contacto;
  document.getElementById('p_email').textContent = cliente.email || '-';
  document.getElementById('p_sexo').textContent = cliente.sexo;
  document.getElementById('p_sexo').className = "badge " + (cliente.sexo==='Masculino'?'masculino':'feminino');
  document.getElementById('p_sexo2').textContent = cliente.sexo;
  document.getElementById('p_data').textContent = new Date(cliente.dataCadastro).toLocaleDateString('pt-MZ');
  
  if(cliente.dataNascimento){
    let idade = new Date().getFullYear() - new Date(cliente.dataNascimento).getFullYear();
    document.getElementById('p_idade').textContent = idade + " anos";
  }
}
function sair(){
  if(confirm("Sair? Vai apagar dados do aparelho")){
    localStorage.removeItem('clienteLF');
    localStorage.removeItem('clienteLogadoLF');
    location.href='cadastro.html';
  }
}
carregar();
</script>
</body>
</html>
