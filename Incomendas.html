<body>
    <header class="topo">
        <h1 class="nome">LFentregadora.Lda</h1>
        <button id="botao"><a href="pagina principal.html">Voltar</a></button>
    </header>

    <h2>Encomendas</h2>
    <div class="Container">
        <!-- Adicionados IDs para identificação via JavaScript -->
        
        <label for="descricao">Descrição do pedido:</label> 
        <input type="text" id="descricao" required> <br><br>

        <label for="nome_cliente">Nome Completo:</label>
        <input type="text" id="nome_cliente" required><br><br>

        <label for="localizacao_cliente">Localização:</label>
        <input type="text" id="localizacao_cliente" required> 

        <label for="bairro_cliente">Bairro:</label>
        <input type="text" id="bairro_cliente" required><br><br>

        <label for="contacto_cliente">Contactos:</label> 
        <input type="text" id="contacto_cliente" required><br><br>

        <label for="nome_empresa" class="h2">Nome da Empresa:</label>
        <input type="text" id="nome_empresa" class="h2" required><br><br>

        <label for="contacto_empresa" class="h2">Contactos da Empresa:</label>
        <input type="text" id="contacto_empresa" class="h2" required><br><br>

        <label for="localizacao_empresa">Localização da Empresa:</label>
        <input type="text" id="localizacao_empresa" required><br><br>

        <button class="botao"><a style="color: white; text-decoration: none;" href="pagina principal.html">Encomendar</a></button>
    </div>

    <!-- Script JavaScript para ler a URL e preencher os campos -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Obtém os parâmetros enviados pela URL
            const urlParams = new URLSearchParams(window.location.search);

            // Lê os dados específicos enviados da página anterior
            const produtoSel = urlParams.get('produto');
            const empresaSel = urlParams.get('empresa');
            const contactoEmpresaSel = urlParams.get('telefone_empresa');
            const localizacaoEmpresaSel = urlParams.get('localizacao_empresa');

            // Se existirem dados na URL, preenche automaticamente os campos do formulário
            if (produtoSel) {
                document.getElementById('descricao').value = "Encomenda: " + produtoSel;
            }

            if (empresaSel) {
                document.getElementById('nome_empresa').value = empresaSel;
            }

            if (contactoEmpresaSel) {
                document.getElementById('contacto_empresa').value = contactoEmpresaSel;
            }

            if (localizacaoEmpresaSel) {
                document.getElementById('localizacao_empresa').value = localizacaoEmpresaSel;
            }
        });
    </script>
</body>
