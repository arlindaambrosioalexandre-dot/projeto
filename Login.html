<!DOCTYPE html>
<html lang="pt-mz">
<head>
  <meta charset="UTF-8" />
  <title>Lfentregadora.Lda - Login</title>
  <link rel="stylesheet" href="Indice.css" />
  <link rel="stylesheet" href="Login.css" />
</head>
<style>
  body{
    background-image: url(Imagens/ai-generated-blurred-background-interior-of-a-large-modern-warehouse-photo.jpg);
            background-position: center;
background-size: cover;
width: 100%;
height: 100%;
background-repeat: no-repeat;
  }
  .tela-login {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 40px 50px;
}

.caixa-login {
  width: 100%;
  max-width: 620px;
}

/* labels grandes e centradas desta pagina
   (precisa de .campo-form na frente para ganhar em especificidade a .campo-form label) */
.campo-form .topo {
  font-size: 30px;
  text-align: center;
  color: white;
  margin-top: 30px;
}

.caixa-login .campo-form input {
  height: 40px;
  background: #f4f1f1;
}

.caixa-login .botao-principal {
  background: #2bc9b9;
  width: 90px;
  height: 40px;
  padding: 0;            /* o padding global de 40px esmagava o texto "Entrar" */
  border-radius: 20px;
  font-size: 18px;
  border: 1px solid var(--cor-cartao-borda);
  margin-top: 50px;
}

.caixa-login .link-secundario {
  font-size: 20px;
  margin-top: 30px;
  
}

.botao-fantasma {
  display: block;
  width: 300px;
  margin: 50px auto 0;   /* auto = centrado (antes: margin-left:200px, descentrado) */
  text-align: center;
  background: #cfeeeb;
  border: 1px solid var(--cor-cartao-borda);
  border-radius: 10px;
  padding: 14px;
  font-family: var(--fonte-titulo);
  font-size: 20px;
  color: #111;           /* antes: branco sobre #cfeeeb = quase invisivel */
  cursor: pointer;
}
.topo-marca{
  text-align: justify;
}
.logo-letras{
  text-align: left;
  align-items: left;
}
#botao{
  border: 2px solid rgba(0, 157, 255, 0.845);
  margin-left: 1100px;
  border-radius: 20px;
  width: 100px;
  height: 30px;
  background-color: rgb(127, 255, 244);
 margin-block: 30px;
}
h1{
  text-align: justify;
}
nav{
  display: flex;
 
}
#botao a{
   
 text-decoration: none;
}
.link-secundario a{
text-decoration: none;
  color: white;
}
</style>
<body>
<nav>
<h1>LFentregadora.Lda</h1>
<button id="botao"><a href="Pagina principal.css">Voltar</a></button>
</nav>
  <div class="lista-frames">

    <section class="frame tela-login">

      <div class="topo-marca" style="align-self:flex-start; padding:0;">
                
      </div>

      <div class="icone-usuario-grande">&#128100;</div>

      <div class="caixa-login">
        <div class="campo-form">
          <label class="topo">E-mail ou numero de telemovel</label>
          <input type="text" placeholder="Digite o seu e-mail ou numero de telemovel" required> 
        </div>
        <div class="campo-form">
          <label class="topo">Palavra-passe</label>
          <input type="password" placeholder="Digite a sua palavra-passe" required>
        </div>

        <div style="text-align:center; margin-top:20px;">
          <button class="botao-principal"><b>Entrar</b></button>
        </div>

        <p class="link-secundario"> Esqueceu-se da palavra-passe?</p>
        <button class="botao-fantasma"><a href="cadastroo.html"></a>Criar conta</button>
      </div>
    
    </section>

  </div>
</body>
</html>
